<footer class="footer footer-black">
  <div class="container">
    <div class="row align-items-center">

      <div class="col-md-2 text-center text-md-left mb-3 mb-md-0">
        <span class="footer-brand d-inline-flex align-items-center">
          <img [src]="footerBrandUrl" [attr.alt]="'nav.brandAlt' | transloco" class="footer-brand-logo" width="220" height="44" decoding="async">
        </span>
      </div>

      <div class="col-md-7 text-center text-md-right">
        <p class="footer-copy mb-0">
          {{ 'footer.copyright' | transloco: { year } }}
          <a [href]="linkedinUrl" target="_blank">Ernye Ruiz Cerdas</a>.
        </p>
      </div>

    </div>
  </div>
</footer>
