<div class="d-flex flex-wrap align-items-start align-items-lg-center justify-content-between mb-4">
  <h1 class="cp-page-title mb-0">Permisos</h1>
  @if (canCreate) {
    <button type="button" class="btn btn-primary btn-sm mt-2 mt-lg-0" (click)="create()">
      <i class="fas fa-plus mr-1"></i>
      Nuevo permiso
    </button>
  }
</div>

@if (!rows().length) {
  <p class="text-muted">No hay permisos registrados.</p>
} @else {
  <div class="table-responsive admin-table-wrap">
    <table class="table table-striped table-hover mb-0">
      <thead class="thead-light">
        <tr>
          <th>Nombre</th>
          <th>Descripción</th>
          <th>Creado</th>
          <th class="text-right">Acciones</th>
        </tr>
      </thead>
      <tbody>
        @for (r of rows(); track r.id) {
          <tr>
            <td><code>{{ r.name }}</code></td>
            <td>{{ r.description || '—' }}</td>
            <td>{{ r.createdAt | date: 'short' }}</td>
            <td class="text-right text-nowrap">
              @if (canUpdate) {
                <button
                  type="button"
                  class="btn btn-sm btn-outline-primary mr-1"
                  (click)="edit(r.id)">
                  Editar
                </button>
                <button type="button" class="btn btn-sm btn-outline-danger" (click)="remove(r)">
                  Eliminar
                </button>
              }
            </td>
          </tr>
        }
      </tbody>
    </table>
  </div>
}
