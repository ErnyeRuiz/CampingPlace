@if (campsite(); as c) {
  <article class="detail">
    <header class="detail__header">
      <h1>{{ c.name }}</h1>
      <p class="detail__location">{{ c.latitude }}, {{ c.longitude }}</p>
    </header>
    <section class="detail__body">
      <p>{{ c.description }}</p>
      <p><strong>Precio:</strong> {{ c.pricePerNight | currency:'CRC' }} / noche</p>
      <p><strong>Agua:</strong> {{ c.hasWater ? 'Si' : 'No' }}</p>
      <p><strong>Electricidad:</strong> {{ c.hasElectricity ? 'Si' : 'No' }}</p>
    </section>
  </article>
}
